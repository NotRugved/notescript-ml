<!-- NoteScript ML — Spider-Web Intro Animation (pure CSS, no JavaScript) -->
<style>
/* ── Overlay ──────────────────────────────────────────────────────────── */
#ns-intro-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    animation: ns-overlay-out 0.5s ease forwards;
    animation-delay: 3.2s;
}

@keyframes ns-overlay-out {
    0%   { opacity: 1; pointer-events: all; visibility: visible; }
    99%  { opacity: 0; pointer-events: none; visibility: visible; }
    100% { opacity: 0; pointer-events: none; visibility: hidden; }
}

/* ── SVG Web ──────────────────────────────────────────────────────────── */
#ns-web-svg {
    width: min(380px, 70vw);
    height: min(380px, 70vw);
    position: absolute;
    opacity: 0.9;
}

/* ─── Spokes (8 radial threads) draw outward ─────────────────────────── */
.ns-spoke {
    stroke: #ffffff;
    stroke-width: 1.2;
    fill: none;
    stroke-dasharray: 190;
    stroke-dashoffset: 190;
    animation: ns-draw 0.45s ease forwards;
}
.ns-spoke:nth-child(1)  { animation-delay: 0.05s; }
.ns-spoke:nth-child(2)  { animation-delay: 0.10s; }
.ns-spoke:nth-child(3)  { animation-delay: 0.15s; }
.ns-spoke:nth-child(4)  { animation-delay: 0.20s; }
.ns-spoke:nth-child(5)  { animation-delay: 0.25s; }
.ns-spoke:nth-child(6)  { animation-delay: 0.30s; }
.ns-spoke:nth-child(7)  { animation-delay: 0.35s; }
.ns-spoke:nth-child(8)  { animation-delay: 0.40s; }

/* ─── Concentric rings draw after spokes ──────────────────────────────── */
.ns-ring {
    fill: none;
    stroke-width: 1.2;
    animation: ns-draw-ring 0.4s ease forwards;
    stroke-dashoffset: 1200;
}
/* alternate white / red */
.ns-ring:nth-child(1) { stroke: #ffffff; stroke-dasharray: 400;  stroke-dashoffset: 400;  animation-delay: 0.55s; }
.ns-ring:nth-child(2) { stroke: #ff2b2b; stroke-dasharray: 630;  stroke-dashoffset: 630;  animation-delay: 0.80s; }
.ns-ring:nth-child(3) { stroke: #ffffff; stroke-dasharray: 850;  stroke-dashoffset: 850;  animation-delay: 1.05s; }
.ns-ring:nth-child(4) { stroke: #ff2b2b; stroke-dasharray: 1070; stroke-dashoffset: 1070; animation-delay: 1.25s; }

@keyframes ns-draw {
    to { stroke-dashoffset: 0; }
}
@keyframes ns-draw-ring {
    to { stroke-dashoffset: 0; }
}

/* ── Glitch Title ─────────────────────────────────────────────────────── */
#ns-intro-title {
    position: relative;
    z-index: 2;
    margin-top: min(220px, 42vw);
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #ffffff;
    opacity: 0;
    animation: ns-title-in 0.3s ease forwards;
    animation-delay: 1.6s;
}

@keyframes ns-title-in {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* Glitch layer — red offset */
#ns-intro-title::before {
    content: 'NOTESCRIPT ML';
    position: absolute;
    left: 3px;
    top: 0;
    color: #ff2b2b;
    clip-path: inset(30% 0 50% 0);
    opacity: 0;
    animation: ns-glitch-red 0.9s steps(1) forwards;
    animation-delay: 1.9s;
}

/* Glitch layer — white offset */
#ns-intro-title::after {
    content: 'NOTESCRIPT ML';
    position: absolute;
    left: -3px;
    top: 0;
    color: #ffffff;
    clip-path: inset(60% 0 20% 0);
    opacity: 0;
    animation: ns-glitch-white 0.9s steps(1) forwards;
    animation-delay: 1.9s;
}

@keyframes ns-glitch-red {
    0%  { opacity: 0; transform: none; }
    10% { opacity: 1; transform: translate(-2px, 0); clip-path: inset(10% 0 65% 0); }
    20% { opacity: 1; transform: translate(3px, 0);  clip-path: inset(45% 0 30% 0); }
    30% { opacity: 1; transform: translate(-1px, 0); clip-path: inset(70% 0 10% 0); }
    40% { opacity: 1; transform: translate(2px, 0);  clip-path: inset(20% 0 55% 0); }
    50% { opacity: 1; transform: translate(-3px, 0); clip-path: inset(55% 0 15% 0); }
    60% { opacity: 1; transform: translate(1px, 0);  clip-path: inset(5%  0 80% 0); }
    70% { opacity: 1; transform: translate(-2px, 0); clip-path: inset(35% 0 40% 0); }
    80% { opacity: 1; transform: translate(2px, 0);  clip-path: inset(75% 0 5%  0); }
    90% { opacity: 0.5; transform: none; }
   100% { opacity: 0; transform: none; }
}

@keyframes ns-glitch-white {
    0%  { opacity: 0; transform: none; }
    10% { opacity: 1; transform: translate(2px, 0);  clip-path: inset(60% 0 20% 0); }
    20% { opacity: 1; transform: translate(-3px, 0); clip-path: inset(15% 0 60% 0); }
    30% { opacity: 1; transform: translate(1px, 0);  clip-path: inset(80% 0 5%  0); }
    40% { opacity: 1; transform: translate(-2px, 0); clip-path: inset(30% 0 45% 0); }
    50% { opacity: 1; transform: translate(3px, 0);  clip-path: inset(50% 0 25% 0); }
    60% { opacity: 1; transform: translate(-1px, 0); clip-path: inset(10% 0 70% 0); }
    70% { opacity: 1; transform: translate(2px, 0);  clip-path: inset(65% 0 10% 0); }
    80% { opacity: 0.6; transform: none; }
   100% { opacity: 0; transform: none; }
}

/* ── Reduced-motion override ──────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
    #ns-intro-overlay {
        animation: ns-overlay-out-fast 0.3s ease forwards;
        animation-delay: 0.5s;
    }
    .ns-spoke, .ns-ring {
        animation: none;
        stroke-dashoffset: 0;
    }
    #ns-intro-title {
        opacity: 1;
        animation: none;
    }
    #ns-intro-title::before,
    #ns-intro-title::after {
        display: none;
    }
    @keyframes ns-overlay-out-fast {
        to { opacity: 0; pointer-events: none; visibility: hidden; }
    }
}
</style>

<div id="ns-intro-overlay">

  <!-- Spider web SVG (190px center, 380px viewBox) -->
  <svg id="ns-web-svg" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">

    <!-- Group 1: Spokes (8 radial threads from center 190,190) -->
    <g id="ns-spokes">
      <!-- right -->
      <line class="ns-spoke" x1="190" y1="190" x2="380" y2="190" />
      <!-- lower-right -->
      <line class="ns-spoke" x1="190" y1="190" x2="325" y2="325" />
      <!-- down -->
      <line class="ns-spoke" x1="190" y1="190" x2="190" y2="380" />
      <!-- lower-left -->
      <line class="ns-spoke" x1="190" y1="190" x2="55"  y2="325" />
      <!-- left -->
      <line class="ns-spoke" x1="190" y1="190" x2="0"   y2="190" />
      <!-- upper-left -->
      <line class="ns-spoke" x1="190" y1="190" x2="55"  y2="55"  />
      <!-- up -->
      <line class="ns-spoke" x1="190" y1="190" x2="190" y2="0"   />
      <!-- upper-right -->
      <line class="ns-spoke" x1="190" y1="190" x2="325" y2="55"  />
    </g>

    <!-- Group 2: Concentric rings (4 circles, grow outward) -->
    <g id="ns-rings">
      <circle class="ns-ring" cx="190" cy="190" r="63"  />
      <circle class="ns-ring" cx="190" cy="190" r="100" />
      <circle class="ns-ring" cx="190" cy="190" r="135" />
      <circle class="ns-ring" cx="190" cy="190" r="170" />
    </g>

  </svg>

  <div id="ns-intro-title">NOTESCRIPT ML</div>

</div>
